name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -c "from pathlib import Path; files=['collect_results.py','collect_candidate_details.py','analyze_candidate_documents.py','score_results.py']; [compile(Path(f).read_text(encoding='utf-8'), f, 'exec') for f in files]; print('Syntax check passed')"

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
